<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Risiko & Pantauan Hujan - Solok Selatan</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Header Style */
        #header {
            background-color: #1a1a1a;
            color: white;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        #header h2 { margin: 0; font-size: 1.2rem; }
        #header small { color: #aaa; font-size: 0.8rem; }

        /* Map Container */
        #map { position: absolute; top: 60px; bottom: 0; width: 100%; z-index: 1; cursor: crosshair; }

        /* Loading Spinner */
        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 2000; background: rgba(255,255,255,0.9); padding: 20px;
            border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.2);
            text-align: center; display: none;
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Legend Style */
        .legend {
            background: white; padding: 10px; line-height: 1.5;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 5px;
            font-size: 12px;
            max-height: 300px; overflow-y: auto;
            min-width: 150px;
        }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.7; }
        .legend h4 { margin: 0 0 5px; font-size: 14px; border-bottom: 1px solid #ccc; padding-bottom: 3px;}
        .legend-section { margin-bottom: 12px; }

        /* Custom Popup */
        .custom-popup .leaflet-popup-content-wrapper { border-radius: 5px; }
        .risk-badge { padding: 2px 6px; border-radius: 4px; color: white; font-weight: bold; font-size: 11px; }
        
        /* Popup Weather */
        .weather-popup b { color: #0077b6; font-size: 1.1em; }
        .weather-popup span { font-size: 0.9em; color: #555; }
    </style>
</head>
<body>

    <div id="header">
        <div>
            <h2><i class="fa-solid fa-cloud-showers-heavy"></i> Risiko & Pantauan Hujan</h2>
            <small>Solok Selatan: Klik Peta untuk Cek Cuaca Real-time</small>
        </div>
        <div>
            <a href="#" style="color:white; text-decoration:none;">
                <i class="fa-solid fa-info-circle"></i> Info
            </a>
        </div>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">Memuat Data...</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inisialisasi Peta
        var map = L.map('map').setView([-1.5, 101.2], 10);

        // 2. Base Maps
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' });
        var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri' });

        satellite.addTo(map);

        // ==========================================
        //  INTEGRASI API CUACA (OPENWEATHERMAP)
        // ==========================================
        
        const apiKey = '3a3e47a47e051b4cd78e04d4a50f0c8c';
        var weatherMarker = null;

        function fetchRainData(lat, lon) {
            if (weatherMarker) {
                map.removeLayer(weatherMarker);
            }
            document.body.style.cursor = 'wait'; 

            const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=id`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    document.body.style.cursor = 'default';
                    
                    const rain1h = (data.rain && data.rain['1h']) ? data.rain['1h'] : 0;
                    const weatherDesc = data.weather[0].description;
                    const temp = data.main.temp;
                    
                    let rainStatus = '';
                    let icon = '';
                    
                    if (rain1h > 0) {
                        rainStatus = `<span style="color:red; font-weight:bold;">Hujan: ${rain1h} mm/jam</span>`;
                        icon = '🌧️';
                    } else {
                        rainStatus = `<span style="color:green; font-weight:bold;">Tidak Ada Hujan</span>`;
                        icon = '☁️';
                    }

                    const popupContent = `
                        <div class="weather-popup" style="text-align:center;">
                            <b>${icon} Cuaca Saat Ini</b><br>
                            <hr style="margin:5px 0;">
                            <span style="text-transform:capitalize;">${weatherDesc}</span><br>
                            ${rainStatus}<br>
                            <small>Suhu: ${temp}°C</small><br>
                            <small style="color:#aaa">Lokasi: ${lat.toFixed(4)}, ${lon.toFixed(4)}</small>
                        </div>
                    `;

                    weatherMarker = L.marker([lat, lon]).addTo(map);
                    weatherMarker.bindPopup(popupContent).openPopup();
                })
                .catch(err => {
                    console.error('Gagal mengambil data cuaca:', err);
                    document.body.style.cursor = 'default';
                });
        }

        map.on('click', function(e) {
            fetchRainData(e.latlng.lat, e.latlng.lng);
        });

        // ==========================================
        //  DATA GEOJSON (Banjir & Longsor)
        // ==========================================

        function styleBanjir(feature) {
            var level = feature.properties.level;
            var color = '#FFEDA0';
            if (level === 'High') color = '#d32f2f';
            if (level === 'Medium') color = '#f57c00';
            if (level === 'Low') color = '#fbc02d';
            return { fillColor: color, weight: 0, opacity: 1, color: 'white', dashArray: '3', fillOpacity: 0.7 };
        }

        function styleLongsor(feature) {
            var level = feature.properties.level;
            var color = '#fff';
            if (level === 'High') color = '#880e4f';
            if (level === 'Medium') color = '#c2185b';
            if (level === 'Low') color = '#f48fb1';
            return { fillColor: color, weight: 0, opacity: 1, color: 'white', fillOpacity: 0.7 };
        }

        function onEachFeature(feature, layer) {
            if (feature.properties) {
                var color = 'gray';
                var val = feature.properties.level;
                var type = feature.properties.type || 'Bencana';
                
                if(val === 'High') color = 'red';
                if(val === 'Medium') color = 'orange';

                var content = `
                    <div style="font-family: sans-serif;">
                        <h4 style="margin:0;">Risiko ${type}</h4>
                        <hr style="margin:5px 0;">
                        Level: <span class="risk-badge" style="background:${color}">${val}</span>
                    </div>
                `;
                layer.bindPopup(content, {className: 'custom-popup'});
            }
        }

        var banjirLayer = L.geoJSON(null, { style: styleBanjir, onEachFeature: onEachFeature });
        var longsorLayer = L.geoJSON(null, { style: styleLongsor, onEachFeature: onEachFeature });

        async function loadData() {
            var loader = document.getElementById('loading');
            loader.style.display = 'block';
            try {
                // Load Banjir
                const resBanjir = await fetch('Risiko_Banjir_SolokSelatan_Lengkap.geojson');
                if(resBanjir.ok) banjirLayer.addData(await resBanjir.json());

                // Load Longsor
                const resLongsor = await fetch('Risiko_Longsor_SolokSelatan_Lengkap.geojson');
                if(resLongsor.ok) longsorLayer.addData(await resLongsor.json());

                banjirLayer.addTo(map); 
                map.fitBounds(banjirLayer.getBounds());
            } catch (err) {
                console.log("Info: File GeoJSON mungkin belum ada di server.");
            } finally {
                loader.style.display = 'none';
            }
        }
        loadData();

        var baseMaps = { "Satelit": satellite, "Peta Jalan": osm };
        var overlayMaps = {
            "<span style='color:red'>Risiko Banjir</span>": banjirLayer,
            "<span style='color:purple'>Risiko Longsor</span>": longsorLayer
        };
        L.control.layers(baseMaps, overlayMaps, {collapsed: false}).addTo(map);

        // ==========================================
        //  LEGENDA (DIPERBAIKI)
        // ==========================================
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            
            // Info Klik
            div.innerHTML += '<div class="legend-section" style="border-bottom:1px solid #ddd; padding-bottom:5px;">';
            div.innerHTML += '<strong>Info Interaktif</strong><br>';
            div.innerHTML += '<i class="fa-solid fa-hand-pointer" style="width:auto; float:none; margin-right:5px;"></i> Klik peta untuk<br>cek cuaca real-time.</div>';
            
            // Legenda Banjir
            div.innerHTML += '<div class="legend-section"><strong>Risiko Banjir (HAND)</strong><br>';
            div.innerHTML += '<i style="background: #d32f2f"></i> Tinggi (< 2m)<br>';
            div.innerHTML += '<i style="background: #f57c00"></i> Sedang (2-5m)<br>';
            div.innerHTML += '<i style="background: #fbc02d"></i> Rendah (5-10m)</div>';
            
            // Legenda Longsor (SUDAH DITAMBAHKAN KEMBALI)
            div.innerHTML += '<div class="legend-section"><strong>Risiko Longsor (Slope)</strong><br>';
            div.innerHTML += '<i style="background: #880e4f"></i> Tinggi (> 40°)<br>';
            div.innerHTML += '<i style="background: #c2185b"></i> Sedang (20-40°)<br>';
            div.innerHTML += '<i style="background: #f48fb1"></i> Rendah (10-20°)</div>';
            
            return div;
        };
        legend.addTo(map);

    </script>
</body>
</html>
