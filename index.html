<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Risiko Banjir & Longsor - Solok Selatan</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Header Style */
        #header {
            background-color: #1a1a1a;
            color: white;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        #header h2 { margin: 0; font-size: 1.2rem; }
        #header small { color: #aaa; font-size: 0.8rem; }

        /* Map Container */
        #map { position: absolute; top: 60px; bottom: 0; width: 100%; z-index: 1; }

        /* Loading Spinner */
        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 2000; background: rgba(255,255,255,0.9); padding: 20px;
            border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.2);
            text-align: center; display: none; /* Hidden by default */
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
            border-radius: 50%; width: 30px; height: 30px;
            animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Legend Style */
        .legend {
            background: white; padding: 10px; line-height: 1.5;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 5px;
            font-size: 12px;
        }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.7; }
        .legend h4 { margin: 0 0 5px; font-size: 14px; }

        /* Custom Popup */
        .custom-popup .leaflet-popup-content-wrapper {
            border-radius: 5px;
        }
        .risk-badge {
            padding: 2px 6px; border-radius: 4px; color: white; font-weight: bold; font-size: 11px;
        }
    </style>
</head>
<body>

    <div id="header">
        <div>
            <h2><i class="fa-solid fa-map-location-dot"></i> Peta Risiko Bencana</h2>
            <small>Kabupaten Solok Selatan - Analisis HAND & Slope</small>
        </div>
        <div>
            <a href="https://github.com/ridhoarazzak" target="_blank" style="color:white; text-decoration:none;">
                <i class="fa-brands fa-github"></i> Info
            </a>
        </div>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">Memuat Data Peta...</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inisialisasi Peta
        var map = L.map('map').setView([-1.5, 101.2], 10); // Koordinat Solok Selatan

        // 2. Base Maps (Latar Belakang)
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        });

        var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri'
        });

        // Set default basemap
        satellite.addTo(map);

        // 3. Style Functions (Warna berdasarkan Level)
        function styleBanjir(feature) {
            var level = feature.properties.level;
            var color = '#FFEDA0'; // Default
            if (level === 'High') color = '#d32f2f';      // Merah Gelap
            if (level === 'Medium') color = '#f57c00';    // Oranye
            if (level === 'Low') color = '#fbc02d';       // Kuning
            
            return {
                fillColor: color,
                weight: 0,
                opacity: 1,
                color: 'white',
                dashArray: '3',
                fillOpacity: 0.7
            };
        }

        function styleLongsor(feature) {
            var level = feature.properties.level;
            var color = '#fff';
            if (level === 'High') color = '#880e4f';      // Ungu/Merah Tua
            if (level === 'Medium') color = '#c2185b';    // Pink Tua
            if (level === 'Low') color = '#f48fb1';       // Pink Muda

            return {
                fillColor: color,
                weight: 0,
                opacity: 1,
                color: 'white',
                fillOpacity: 0.7
            };
        }

        // 4. Popup Interaktif
        function onEachFeature(feature, layer) {
            if (feature.properties) {
                var color = 'gray';
                if(feature.properties.level === 'High') color = 'red';
                if(feature.properties.level === 'Medium') color = 'orange';
                
                var content = `
                    <div style="font-family: sans-serif;">
                        <h4 style="margin:0;">Risiko ${feature.properties.type}</h4>
                        <hr style="margin:5px 0;">
                        Level: <span class="risk-badge" style="background:${color}">${feature.properties.level}</span><br>
                        <small>Koordinat: ${layer.getBounds().getCenter().lat.toFixed(4)}, ${layer.getBounds().getCenter().lng.toFixed(4)}</small>
                    </div>
                `;
                layer.bindPopup(content, {className: 'custom-popup'});
            }
        }

        // 5. Load GeoJSON Data
        var banjirLayer = L.geoJSON(null, { style: styleBanjir, onEachFeature: onEachFeature });
        var longsorLayer = L.geoJSON(null, { style: styleLongsor, onEachFeature: onEachFeature });

        // Fungsi Load Data
        async function loadData() {
            var loader = document.getElementById('loading');
            var textLoader = document.getElementById('loading-text');
            
            loader.style.display = 'block';

            try {
                // Load Banjir
                textLoader.innerText = "Memuat Data Banjir...";
                const resBanjir = await fetch('Risiko_Banjir_SolokSelatan_Lengkap.geojson');
                if(!resBanjir.ok) throw new Error("Gagal load file Banjir");
                const dataBanjir = await resBanjir.json();
                banjirLayer.addData(dataBanjir);

                // Load Longsor
                textLoader.innerText = "Memuat Data Longsor...";
                const resLongsor = await fetch('Risiko_Longsor_SolokSelatan_Lengkap.geojson');
                if(!resLongsor.ok) throw new Error("Gagal load file Longsor");
                const dataLongsor = await resLongsor.json();
                longsorLayer.addData(dataLongsor);

                // Add to Map (Default Banjir nyala)
                banjirLayer.addTo(map); 
                // Longsor dimatikan dulu biar tidak berat/penuh
                // longsorLayer.addTo(map); 

                // Zoom ke area data
                map.fitBounds(banjirLayer.getBounds());

            } catch (err) {
                alert("Error: " + err.message + "\nPastikan file GeoJSON ada di folder yang sama dan dijalankan lewat Server.");
                console.error(err);
            } finally {
                loader.style.display = 'none';
            }
        }

        // Jalankan Load Data
        loadData();

        // 6. Layer Control (Tombol Ganti Layer)
        var baseMaps = {
            "Satelit": satellite,
            "Peta Jalan": osm
        };

        var overlayMaps = {
            "<span style='color:red'>Risiko Banjir</span>": banjirLayer,
            "<span style='color:purple'>Risiko Longsor</span>": longsorLayer
        };

        L.control.layers(baseMaps, overlayMaps, {collapsed: false}).addTo(map);

        // 7. Legenda Peta
        var legend = L.control({position: 'bottomright'});

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML += '<h4>Legenda Risiko</h4>';
            
            div.innerHTML += '<strong>Banjir (HAND)</strong><br>';
            div.innerHTML += '<i style="background: #d32f2f"></i> Tinggi (< 2m)<br>';
            div.innerHTML += '<i style="background: #f57c00"></i> Sedang (2-5m)<br>';
            div.innerHTML += '<i style="background: #fbc02d"></i> Rendah (5-10m)<br><br>';

            div.innerHTML += '<strong>Longsor (Slope)</strong><br>';
            div.innerHTML += '<i style="background: #880e4f"></i> Tinggi (> 30°)<br>';
            div.innerHTML += '<i style="background: #c2185b"></i> Sedang (15-30°)<br>';
            div.innerHTML += '<i style="background: #f48fb1"></i> Rendah (8-15°)<br>';

            return div;
        };

        legend.addTo(map);

    </script>
</body>
</html>
